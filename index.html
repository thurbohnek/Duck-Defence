/* ------------------------------ INPUT ------------------------------ */
const gameEl = $('game');
function releaseInput(){ input.keys = {}; input.jActive = false; input.pid = -1; input.jx = input.jy = 0; input.tapActive = false; }
function stickFrom(ev, R){
  const dx = ev.clientX - input.ox, dy = ev.clientY - input.oy, d = Math.hypot(dx, dy);
  if (d < 6){ input.jx = 0; input.jy = 0; }
  else { const m = Math.min(d, R) / R; input.jx = dx / d * m; input.jy = dy / d * m; }
}
function arrowsFrom(ev){
  const g = ctrlGeom(); const dx = ev.clientX - g.cx, dy = ev.clientY - g.cy;
  if (Math.hypot(dx, dy) < g.btn * 0.3){ input.jx = 0; input.jy = 0; return; }
  const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
  input.jx = Math.cos(a); input.jy = Math.sin(a);
  if (Math.abs(input.jx) < 1e-6) input.jx = 0; if (Math.abs(input.jy) < 1e-6) input.jy = 0;
}
gameEl.addEventListener('pointerdown', ev => {
  Snd.init(); lastPointer = ev.pointerType === 'touch' || ev.pointerType === 'pen' ? 'touch' : 'mouse';
  if (state !== 'play' || input.pid !== -1) return;
  if (ev.pointerType === 'mouse' && SAVE.settings.follow) return;
  const mode = ctrlMode();
  if (mode === 'fixed' || mode === 'arrows'){
    const g = ctrlGeom();
    if (Math.abs(ev.clientX - g.cx) > g.half * 1.9 || Math.abs(ev.clientY - g.cy) > g.half * 1.9) return;
    input.pid = ev.pointerId; input.jActive = true; input.ox = g.cx; input.oy = g.cy;
    if (mode === 'fixed') stickFrom(ev, g.R); else arrowsFrom(ev);
  } else if (mode === 'tap'){
    input.pid = ev.pointerId; input.tapActive = true; input.tapHas = true; input.tapSX = ev.clientX; input.tapSY = ev.clientY;
    input.tapWX = (ev.clientX - W / 2) / cam.scale + cam.x; input.tapWY = (ev.clientY - H / 2) / cam.scale + cam.y;
  } else if (mode === 'swipe'){
    input.pid = ev.pointerId; input.swSX = ev.clientX; input.swSY = ev.clientY; input.swT = performance.now(); input.swMoved = false;
  } else {
    input.pid = ev.pointerId; input.jActive = true; input.ox = ev.clientX; input.oy = ev.clientY; input.jx = 0; input.jy = 0;
  }

});
gameEl.addEventListener('pointermove', ev => {
  input.mouseX = ev.clientX; input.mouseY = ev.clientY; input.mouseIn = ev.pointerType === 'mouse';

  else if (mode === 'arrows') arrowsFrom(ev);
  else if (mode === 'tap'){ input.tapSX = ev.clientX; input.tapSY = ev.clientY; }
  else if (mode === 'swipe'){
    const dx = ev.clientX - input.swSX, dy = ev.clientY - input.swSY, d = Math.hypot(dx, dy);
    if (d > 22){ input.swX = dx / d; input.swY = dy / d; input.swSX = ev.clientX; input.swSY = ev.clientY; input.swMoved = true; }
  }
  else stickFrom(ev, 56);
});
function endPointer(ev){
  if (ev.pointerId !== input.pid) return;
  if (ctrlMode() === 'swipe' && !input.swMoved && ev.type === 'pointerup' && performance.now() - input.swT < 350){ input.swX = 0; input.swY = 0; }
  input.pid = -1; input.jActive = false; input.jx = input.jy = 0; input.tapActive = false;
}
gameEl.addEventListener('pointerup', endPointer);
gameEl.addEventListener('pointercancel', endPointer);
gameEl.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') input.mouseIn = false; });
gameEl.addEventListener('contextmenu', ev => ev.preventDefault());
window.addEventListener('keydown', ev => {
  Snd.init();
  const c = ev.code;
  if (!$('confirm').classList.contains('hidden')){ if (c === 'Escape'){ closeConfirm(false); ev.preventDefault(); } return; }
  if (state === 'play'){
    if (c === 'Escape' || c === 'KeyP'){ pauseGame(); ev.preventDefault(); return; }
    if (/^(Arrow|Key[WASD])/.test(c)){ input.keys[c] = true; lastPointer = 'mouse'; ev.preventDefault(); }
  } else if (state === 'pause'){
    if (c === 'Escape' || c === 'KeyP'){ resumeGame(); ev.preventDefault(); }
  } else if (state === 'level'){
    if (c === 'Digit1' || c === 'Numpad1') chooseCard(0);
    else if (c === 'Digit2' || c === 'Numpad2') chooseCard(1);
    else if (c === 'Digit3' || c === 'Numpad3') chooseCard(2);
    else if (c === 'Digit4' || c === 'Numpad4') chooseCard(3);
    else if (c === 'KeyR') reroll();
  } else if (state === 'chest'){

window.addEventListener('keyup', ev => { delete input.keys[ev.code]; });
window.addEventListener('blur', () => { releaseInput(); });

  else Snd.resume();

// button wiring
function on(id, fn){ $(id).addEventListener('click', ev => { Snd.init(); Snd.play('click'); fn(ev); }); }

on('bDucksBack', goTitle); on('bShopBack', goTitle); on('bSetBack', goTitle);

/* ------------------------------ MAIN LOOP ------------------------------ */
let lastT = 0, acc = 0, bot = null, clock = 0;
function frame(now){
  const t = now / 1000;
  let dt = lastT ? t - lastT : STEP; lastT = t;
  if (dt > 0.25) dt = 0.25;
  clock += dt;
  if (state === 'play' && run){
    acc += dt;
    if (dt < 0.1){
      slowEma = slowEma * 0.94 + dt * 0.06; slowCool -= dt;
      if (slowEma > 1 / 42 && slowCool <= 0 && DPR > 1){ qualDPR = Math.max(1, DPR - 0.5); slowCool = 2; slowEma = 1 / 60; resize(); }
    }
    let n = 0;
    while (acc >= STEP && n < 3 && state === 'play'){
      step(STEP); acc -= STEP; n++;
      if (state === 'play' && run.pendingLv > 0 && player.alive && !run.won){ if (bot) botLevel(); else { openLevelUp(); break; } }
    }
    if (n >= 3) acc = 0;
    if (run && !run.over) updateHUD();
  }
  render(clock);
}
function loop(now){ try { frame(now); } catch (e) { if (window.console) console.error(e); } requestAnimationFrame(loop); }

// test hooks (used by the headless harness; harmless in the browser)
function botLevel(){
  while (run.pendingLv > 0){
    run.pendingLv--;
    const opts = buildOptions(3);
    const i = bot.pick ? bot.pick(opts) : 0;
    applyOption(opts[i] || opts[0]);
  }
}
window.__duckDefense = {
  get run(){ return run; }, get player(){ return player; }, get state(){ return state; }, set state(v){ state = v; },
  elist, plist, eplist, parts, pickups, nums, fx, mines,
  get SAVE(){ return SAVE; }, startRun, goTitle, frame, step, chooseCard, buildOptions, applyOption, endRun, openChest, renderShop, renderDucks,
  setBot(fn){ bot = fn; }, WEAPONS, PASSIVES, DUCKS, ETYPES, SHOP, spawnEnemy, spawnBoss, evolve, canEvolve, pauseGame, resumeGame, closeChest, reroll,
  openLevelUp, get curOpts(){ return curOpts; }
};

makePatterns();
resize();
goTitle();
requestAnimationFrame(loop);
})();
