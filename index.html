<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16748d">
<title>Duck Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --ink:#1f3350; --ink2:#3d5a80; --water:#58c4d4; --deep:#16748d; --foam:#f3fbfb;
  --duck:#ffd23f; --duck2:#f2b705; --beak:#ff8a3d; --coral:#ff6b6b; --grime:#8b6cc0;
  --mint:#6fdcae; --enamel:#fffaf1; --enamel2:#f1e6d3; --gold:#ffc23a; --sky:#bfeaf2;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#16748d}
body{font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;font-weight:700}
*{box-sizing:border-box}
.display{font-family:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;letter-spacing:.03em;font-weight:400}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;width:100%;height:100%}
.hidden{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px dashed #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--ink)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;user-select:none;-webkit-user-select:none;
  padding:calc(6px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.xpbar{position:relative;height:14px;border:3px solid var(--ink);border-radius:10px;background:#0e4f61;overflow:hidden}
#xpfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7fe6ff,#c9f5ff);border-radius:0 6px 6px 0;transition:width .12s}
.hudrow{display:flex;align-items:center;gap:10px;margin-top:6px;min-height:44px}
.hpwrap{display:flex;align-items:center;gap:8px;flex:1 1 0;min-width:0}
.lvbadge{flex:none;min-width:44px;height:30px;padding:0 8px;border:3px solid var(--ink);border-radius:10px;background:var(--duck);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.hpbar{position:relative;flex:1 1 auto;max-width:220px;height:20px;border:3px solid var(--ink);border-radius:10px;background:#6b2c3a;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
#hpfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#ff8d8d,#ff5a5f);transition:width .15s}
#hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 0 var(--ink),0 -1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink)}
#timer{flex:none;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 6px rgba(31,51,80,.5);min-width:72px;text-align:center}
.hudright{flex:1 1 0;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.killc{display:flex;align-items:center;gap:5px;color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
.killc i{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#bfe9ff 45%,#8ad3f0);border:2px solid var(--ink)}
#pauseBtn{pointer-events:auto;width:44px;height:44px;flex:none;border:3px solid var(--ink);border-radius:12px;background:var(--enamel);box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:5px;padding:0}
#pauseBtn span{display:block;width:6px;height:16px;background:var(--ink);border-radius:2px}
#slots{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;max-width:100%}
#slots .slot{position:relative;width:28px;height:28px;border:2px solid var(--ink);border-radius:8px;background:rgba(255,250,241,.88)}
#slots .slot.p{background:rgba(223,240,255,.88)}
#slots .slot.e{background:linear-gradient(#fff3c4,#ffd56b)}
#slots .slot canvas{width:100%;height:100%;display:block}
#slots .slot b{position:absolute;right:-3px;bottom:-4px;font-size:10px;line-height:1;background:var(--ink);color:#fff;border-radius:5px;padding:1px 3px}
#slots .gap{width:6px}
#bossbar{margin:8px auto 0;max-width:520px;text-align:center}
#bossname{display:block;color:#fff;font-size:17px;text-shadow:0 2px 0 var(--ink)}
.bb{height:14px;border:3px solid var(--ink);border-radius:9px;background:#3b2348;overflow:hidden;margin-top:2px}
#bossfill{height:100%;width:100%;background:linear-gradient(#c79bff,#8b6cc0)}

#hint{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none;
  background:var(--enamel);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--ink);
  max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .35s, transform .35s}
#hint.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;color:#fff;font-size:clamp(26px,7vw,54px);
  text-shadow:0 4px 0 var(--ink),0 0 18px rgba(31,51,80,.6);opacity:0;transform:scale(.7);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);padding:0 16px}
#banner small{display:block;font-size:.42em;margin-top:6px;font-family:'Nunito',sans-serif;font-weight:900;letter-spacing:.05em}
#banner.show{opacity:1;transform:scale(1)}
#banner.warn{color:#ffd9e0}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center}
.screen.dim{background:rgba(14,52,72,.62)}
.screen>.inner{width:100%;max-width:760px;margin:auto 0}
.panel{background:var(--enamel);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:18px}
h1,h2,h3{margin:0}
.logo{text-align:center;color:var(--duck);font-size:clamp(46px,13vw,104px);line-height:.9;
  text-shadow:0 4px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 10px 0 var(--ink);
  transform:rotate(-3deg);margin:8px 0 6px}
.logo span{display:block;color:#fff}
.tag{text-align:center;color:#fff;font-weight:900;font-size:17px;text-shadow:0 2px 0 var(--ink);margin-bottom:22px}
.menu{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 20px;border:3px solid var(--ink);border-radius:16px;
  background:var(--duck);color:var(--ink);box-shadow:0 5px 0 var(--ink);font-family:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-size:21px;letter-spacing:.04em;
  transition:transform .08s, box-shadow .08s, filter .15s;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.big{min-height:64px;font-size:30px}
.btn.alt{background:var(--enamel)}
.btn.blue{background:#8fe0f0}
.btn.pink{background:#ffb3c1}
.btn.small{min-height:44px;font-size:17px;padding:6px 14px}
.btn[disabled]{filter:grayscale(.7) opacity(.6);cursor:not-allowed}
.chipline{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:900;font-size:19px;text-shadow:0 2px 0 var(--ink);margin-top:18px}
.chip{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#ffc23a 55%,#e08a00);border:2px solid var(--ink);flex:none;vertical-align:middle}
.records{text-align:center;color:#e6fbff;font-size:14px;margin-top:8px;text-shadow:0 1px 0 var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topbar h2{color:#fff;font-size:clamp(28px,7vw,40px);text-shadow:0 3px 0 var(--ink)}
.pillchips{background:var(--enamel);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-weight:900;box-shadow:0 3px 0 var(--ink)}

.duckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.duckcard{position:relative;background:var(--enamel);border:3px solid var(--ink);border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 0 var(--ink);min-height:44px}
.duckcard canvas{width:84px;height:84px;display:block;margin:0 auto}
.duckcard h3{font-size:18px;margin-top:2px}
.duckcard p{margin:4px 0 0;font-size:13px;line-height:1.3;color:var(--ink2)}
.duckcard.sel{background:#fff3c4;outline:4px solid var(--duck);box-shadow:0 4px 0 var(--ink),0 0 0 7px var(--ink)}
.duckcard.locked canvas{filter:brightness(0) opacity(.35)}
.duckcard.locked{background:#e9e3d8}
.duckcard .lock{font-size:12px;color:#8a4b5a;font-weight:900;margin-top:4px}
.startw{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-top:5px;background:#e3f6fb;border-radius:8px;padding:2px 6px}
.startw canvas{width:20px !important;height:20px !important;margin:0 !important}
.selbar{position:sticky;bottom:0;margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:center;padding-bottom:4px}
.heat{display:flex;align-items:center;gap:10px;background:var(--enamel);border:3px solid var(--ink);border-radius:16px;padding:6px 8px;box-shadow:0 4px 0 var(--ink);max-width:100%}
.heat .hv{min-width:150px;text-align:center;font-weight:900;font-size:15px;line-height:1.2}
.heat .hv small{display:block;font-size:12px;color:var(--ink2)}
.heat .btn{width:44px;padding:0}
.duckinfo{color:#fff;text-align:center;font-weight:900;text-shadow:0 2px 0 var(--ink);font-size:15px;max-width:520px}

.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.shopitem{background:var(--enamel);border:3px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:8px}
.shopitem .row{display:flex;gap:10px;align-items:center}
.shopitem canvas{width:44px;height:44px;flex:none;background:#e3f6fb;border-radius:12px;border:2px solid var(--ink)}
.shopitem h3{font-size:17px}
.shopitem p{margin:0;font-size:13px;color:var(--ink2);line-height:1.3}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:8px;border-radius:4px;background:#d8cdb9;border:1.5px solid var(--ink)}
.pips i.on{background:var(--mint)}

.setlist{display:flex;flex-direction:column;gap:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:2px dashed #e2d6c1}
.setrow:last-child{border-bottom:0}
.setrow .lbl{font-weight:900;font-size:16px}
.setrow .lbl small{display:block;font-weight:700;font-size:12px;color:var(--ink2)}
.tog{min-width:84px;min-height:44px;border:3px solid var(--ink);border-radius:999px;background:#d8cdb9;font-weight:900;box-shadow:0 3px 0 var(--ink);padding:0 12px}
.tog[aria-pressed="true"]{background:var(--mint)}
.ctrlbox{padding:6px 0 10px;border-bottom:2px dashed #e2d6c1}
.ctrlbox>.lbl{font-weight:900;font-size:16px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:8px;text-align:left;min-height:52px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 8px;box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:14px;line-height:1.15}
.opt canvas{width:34px;height:34px;flex:none}
.opt small{display:block;font-weight:700;font-size:11px;color:var(--ink2)}
.opt[aria-pressed="true"]{background:var(--duck)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:44px;min-height:44px;padding:0 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.seg button[aria-pressed="true"]{background:var(--duck)}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.subrow span{font-weight:900;font-size:14px}
#safeProbe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* Level up */
.lvtitle{text-align:center;color:var(--duck);font-size:clamp(36px,10vw,58px);text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),0 8px 0 var(--ink);margin-bottom:4px}
.lvsub{text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 0 var(--ink);margin-bottom:14px}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.cards{grid-template-columns:repeat(3,1fr)}.card{flex-direction:column;text-align:center}.card .ctext{align-items:center}}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--enamel);border:4px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 6px 0 var(--ink);min-height:44px;
  animation:cardin .4s cubic-bezier(.2,1.5,.4,1) both;transition:transform .1s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(2px)}
.card.evo{background:linear-gradient(#fff6cf,#ffd96b)}
.card.new{background:linear-gradient(#f2fdff,#cdf3fb)}
.card canvas{width:64px;height:64px;flex:none;background:rgba(31,51,80,.07);border-radius:16px}
.card .ctext{display:flex;flex-direction:column;gap:3px;min-width:0}
.card .cname{font-family:'Luckiest Guy','Arial Rounded MT Bold',sans-serif;font-size:20px;letter-spacing:.03em;line-height:1.05}
.card .ctag{font-size:12px;font-weight:900;color:#fff;background:var(--ink2);border-radius:6px;padding:1px 7px;align-self:flex-start}
@media (min-width:720px){.card .ctag{align-self:center}}
.card.evo .ctag{background:#c76b00}
.card.new .ctag{background:#178aa6}
.card .cdesc{font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.card .cpair{font-size:12px;color:var(--ink2)}
.card .key{display:none;font-size:11px;color:var(--ink2)}
@media (hover:hover) and (pointer:fine){.card .key{display:block}}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.lvactions{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}

.chestlist{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.chestrow{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;animation:cardin .45s cubic-bezier(.2,1.5,.4,1) both}
.chestrow canvas{width:48px;height:48px;flex:none}
.chestrow b{display:block;font-family:'Luckiest Guy',sans-serif;font-weight:400;font-size:18px;letter-spacing:.03em}
.chestrow span{font-size:13px;color:var(--ink2)}

.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:24px;font-family:'Luckiest Guy',sans-serif;font-weight:400;letter-spacing:.03em}
.stat span{font-size:12px;color:var(--ink2);font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.dmgrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.dmgrow canvas{width:28px;height:28px;flex:none}
.dmgrow .nm{width:120px;flex:none;font-size:13px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmgrow .bar{flex:1;height:14px;background:#e8dfcf;border:2px solid var(--ink);border-radius:7px;overflow:hidden;min-width:40px}
.dmgrow .bar i{display:block;height:100%;background:var(--water)}
.dmgrow .v{width:64px;text-align:right;font-size:13px;font-weight:900;flex:none}
.unlocknote{background:#fff3c4;border:3px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0;font-weight:900;text-align:center}
.endtitle{text-align:center;font-size:clamp(34px,9vw,56px);color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),0 7px 0 var(--ink)}
.endsub{text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 0 var(--ink);margin:4px 0 12px}
.row2{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.row2 .btn{flex:1 1 140px;max-width:260px}
.build{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.build .slot{position:relative;width:40px;height:40px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.build .slot canvas{width:100%;height:100%}
.build .slot b{position:absolute;right:-4px;bottom:-5px;font-size:11px;background:var(--ink);color:#fff;border-radius:5px;padding:1px 4px}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,52,72,.7);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:50;touch-action:none}
.modal .panel{max-width:420px;width:100%;text-align:center}
.modal p{font-size:17px;margin:4px 0 16px}
.muted{color:var(--ink2);font-size:13px}
@media (prefers-reduced-motion:reduce){
  .card,.chestrow{animation:none}
  #banner{transition:opacity .2s}
}
</style>

</head>
<body>
<div id="app">
  <div id="game"><canvas id="cv" aria-label="Duck Defense game area"></canvas></div>

  <div id="hud" class="hidden">
    <div class="xpbar"><div id="xpfill"></div></div>
    <div class="hudrow">
      <div class="hpwrap">
        <div class="lvbadge display" id="lvl">1</div>
        <div class="hpbar"><div id="hpfill"></div><div id="hptext">100</div></div>
      </div>
      <div id="timer" class="display">0:00</div>
      <div class="hudright">
        <div class="killc"><i></i><span id="kills">0</span></div>
        <button id="pauseBtn" aria-label="Pause"><span></span><span></span></button>
      </div>
    </div>
    <div id="slots"></div>
    <div id="bossbar" class="hidden"><span id="bossname" class="display"></span><div class="bb"><div id="bossfill"></div></div></div>
  </div>
  <div id="hint"></div>
  <div id="safeProbe"></div>
  <div id="banner" class="display"></div>

  <!-- Title -->
  <div id="scrTitle" class="screen">
    <div class="inner">
      <h1 class="logo display">Duck<span>Defense</span></h1>
      <div class="tag">Squeak back against the grime!</div>
      <div class="menu">
        <button class="btn big" id="bPlay">Play</button>
        <button class="btn blue" id="bDucks">Ducks</button>
        <button class="btn pink" id="bShop">Upgrades</button>
        <button class="btn alt" id="bSettings">Settings</button>
      </div>
      <div class="chipline"><span class="chip"></span><span id="titleChips">0</span> rubber chips</div>
      <div class="records" id="records"></div>
    </div>
  </div>

  <!-- Duck select -->
  <div id="scrDucks" class="screen dim hidden">
    <div class="inner">
      <div class="topbar"><h2 class="display">Pick a Duck</h2><button class="btn alt small" id="bDucksBack">Back</button></div>
      <div class="duckgrid" id="duckGrid"></div>
      <div class="selbar">
        <div class="duckinfo" id="duckInfo"></div>
        <div class="heat hidden" id="heatBox">
          <button class="btn alt small" id="heatDown" aria-label="Lower water temperature">-</button>
          <div class="hv" id="heatVal"></div>
          <button class="btn alt small" id="heatUp" aria-label="Raise water temperature">+</button>
        </div>
        <button class="btn big" id="bStart">Splash In!</button>
      </div>
    </div>
  </div>

  <!-- Shop -->
  <div id="scrShop" class="screen dim hidden">
    <div class="inner">
      <div class="topbar"><h2 class="display">Upgrades</h2>
        <div style="display:flex;gap:10px;align-items:center"><div class="pillchips"><span class="chip"></span><span id="shopChips">0</span></div><button class="btn alt small" id="bShopBack">Back</button></div>
      </div>

<script>
/* ======================================================================
   DUCK DEFENSE - design plan
   ----------------------------------------------------------------------
   Core: arena survivor roguelite in a huge bathtub. Player = rubber duck,
   moves (drag joystick anywhere / WASD / arrows / optional mouse follow),
   weapons fire automatically. Grime invaders swarm in; they drop bath
   pearls (XP). Level up -> pick 1 of 3 cards (weapons, passives, evolutions).

   Enemies (distinct behaviour): Soap Suds (basic chasers), Bubbles (fast
   swarms that rush in straight lines), Angry Sponge (telegraphed lunge),
   Bath-Bomb Fizzer (lights fuse near you, explodes - also hurts grime when
   popped), Sock Monster (wiggles, splits into Lint), Armored Loofah (armor
   + knockback resistance), Shampoo Turret (parks and lobs goo). Elites late.
   Bosses: 3:00 Mega Sponge (dash + droplet ring), 6:00 Drain Monster (pull
   vortex + spirals), 9:00 Big Fizz (jump slams), 12:00 Loofah King (final,
   phases + enrage). Killing the King wins the run.

   8 weapons x 5 levels + evolution with a paired passive at max level:
   Bubble Blaster+Wind-up Timer=Bubble Storm, Squeaky Shockwave+Big Belly=
   Foghorn Honk, Toy Boats+Swim Fins=Armada, Water Jet+Scrub Power=Hydro
   Cannon, Ducklings+Pearl Magnet=Duckling Squadron, Soap Boomerang+Lucky
   Squeak=Slippery Saw, Rubber-Band Whip+Warm Water=Snap Lasso, Splash Mines
   +Thick Rubber=Depth Charges. 9 passives (Foam Party = area, no pair).
   Max 6 weapons + 6 passives. Bosses drop treasure chests (evolve first).

   Meta: rubber chips per run -> shop (11 permanent upgrades). 9 ducks with
   own starting weapon + traits, unlocked by achievements. Water Temperature
   (heat 0-5) unlocked by winning: tougher grime, more chips.

   Tech: fixed 60Hz timestep, pooled entities, uniform-grid spatial hash
   (linked list in typed arrays), pre-rendered enemy sprites incl. flash
   variants, caps on enemies/projectiles/particles/numbers, virtual camera
   scaled by screen area so phones and desktops see a similar arena slice.
   ====================================================================== */
'use strict';
(function(){
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeOut = t => 1 - (1 - t) * (1 - t);
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function wpick(list){ let s = 0; for (const it of list) s += it[1]; let r = Math.random() * s; for (const it of list){ r -= it[1]; if (r <= 0) return it[0]; } return list[list.length - 1][0]; }
function fmtTime(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtNum(n){ n = Math.round(n); if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k'; return String(n); }

let reduceMotion = false;
try { reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}

const INK = '#1f3350';
const WORLD = { w: 2400, h: 1700 };
const STEP = 1 / 60;
const MAX_ENEMIES = 340, MAX_PROJ = 700, MAX_EPROJ = 260, MAX_PARTS = 360, MAX_NUMS = 40, MAX_PICKUPS = 420;
const RUN_BOSSES = [
  { t: 180, id: 'megasponge' },
  { t: 360, id: 'drain' },
  { t: 540, id: 'bigfizz' },
  { t: 720, id: 'king' }
];

/* ------------------------------ SAVE ------------------------------ */
const SAVE_KEY = 'duckDefense.v1';
function defaultSave(){
  return { v: 1, chips: 0, shop: {}, ducks: { sunny: true }, sel: 'sunny', heat: 0, maxHeat: 0,
    stats: { kills: 0, runs: 0, wins: 0, bestTime: 0, bestLevel: 0, bestKills: 0, bosses: {}, evolved: 0 },
    settings: { sound: true, music: true, shake: true, nums: true, follow: false, ctrl: 'float', ctrlPos: 'center', ctrlSize: 'M' } };
}
function mergeInto(base, o){
  if (!o || typeof o !== 'object') return base;
  for (const k in base){
    if (!(k in o)) continue;
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])){
      if (o[k] && typeof o[k] === 'object'){
        // copy unknown nested keys too (shop levels, unlocked ducks, boss kills)
        for (const kk in o[k]) if (!(kk in base[k])) base[k][kk] = o[k][kk];
        mergeInto(base[k], o[k]);
      }
    } else if (typeof o[k] === typeof base[k]) base[k] = o[k];
  }
  return base;
}
function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw){ const o = JSON.parse(raw); if (o && o.v === 1) return mergeInto(defaultSave(), o); }
  } catch (e) {}
  return defaultSave();
}
let SAVE = loadSave();
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }

/* ------------------------------ AUDIO ------------------------------ */
const Snd = {
  ctx: null, master: null, sfx: null, mus: null, noiseBuf: null, last: {}, voices: 0,
  musicTimer: null, nextNote: 0, beat: 0, intense: 0,
  init(){
    if (this.ctx){ if (this.ctx.state === 'suspended') try { this.ctx.resume(); } catch (e) {} return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const c = this.ctx = new AC();
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
      comp.connect(c.destination);
      this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(comp);
      this.sfx = c.createGain(); this.sfx.gain.value = SAVE.settings.sound ? 0.55 : 0; this.sfx.connect(this.master);
      this.mus = c.createGain(); this.mus.gain.value = SAVE.settings.music ? 0.22 : 0; this.mus.connect(this.master);
      const len = c.sampleRate * 0.6; const b = c.createBuffer(1, len, c.sampleRate); const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
      this.startMusic();
    } catch (e) { this.ctx = null; }
  },
  apply(){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.sfx.gain.setTargetAtTime(SAVE.settings.sound ? 0.55 : 0, t, 0.03);
    this.mus.gain.setTargetAtTime(SAVE.settings.music ? 0.22 : 0, t, 0.1);
  },
  ok(name, gap){
    if (!this.ctx || !SAVE.settings.sound || this.ctx.state !== 'running') return false;
    const now = this.ctx.currentTime;
    if (this.last[name] && now - this.last[name] < gap) return false;
    if (this.voices > 26) return false;
    this.last[name] = now; return true;
  },
  tone(f0, f1, dur, type, vol, delay, dest){
    const c = this.ctx; const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(); const g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.02);
    this.voices++; o.onended = () => { this.voices--; };
  },
  noise(dur, f0, f1, vol, ftype, delay){
    const c = this.ctx; const t = c.currentTime + (delay || 0);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = ftype || 'lowpass'; f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t); s.stop(t + dur + 0.02);
    this.voices++; s.onended = () => { this.voices--; };
  },
  play(name, p){
    p = p || 1;
    try {
      switch (name){
        case 'pop': if (!this.ok('pop', 0.03)) return;
          this.tone(520 * p * rand(0.9, 1.15), 140, 0.09, 'sine', 0.22); this.noise(0.05, 3000, 1200, 0.06, 'highpass'); break;
        case 'bigpop': if (!this.ok('bigpop', 0.06)) return;
          this.tone(300, 70, 0.22, 'sine', 0.3); this.noise(0.18, 1600, 300, 0.12); break;
        case 'shoot': if (!this.ok('shoot', 0.07)) return;
          this.tone(760 * rand(0.95, 1.05), 980, 0.06, 'sine', 0.06); break;
        case 'hit': if (!this.ok('hit', 0.04)) return;
          this.tone(240 * rand(0.9, 1.1), 160, 0.05, 'triangle', 0.08); break;
        case 'squeak': if (!this.ok('squeak', 0.12)) return;
          this.tone(880, 1500, 0.08, 'square', 0.05); this.tone(1500, 760, 0.12, 'square', 0.045, 0.07); break;
        case 'hurt': if (!this.ok('hurt', 0.2)) return;
          this.tone(1200, 520, 0.16, 'square', 0.07); this.tone(600, 380, 0.2, 'triangle', 0.1, 0.03); break;
        case 'pearl': if (!this.ok('pearl', 0.035)) return;
          this.tone(1046 * p, 1046 * p * 1.01, 0.09, 'sine', 0.07); break;
        case 'boom': if (!this.ok('boom', 0.08)) return;
          this.noise(0.35, 900, 90, 0.28); this.tone(130, 40, 0.3, 'sine', 0.32); break;
        case 'splash': if (!this.ok('splash', 0.08)) return;
          this.noise(0.22, 2500, 500, 0.12, 'bandpass'); break;
        case 'whip': if (!this.ok('whip', 0.08)) return;
          this.noise(0.08, 4000, 1500, 0.1, 'highpass'); this.tone(500, 1400, 0.06, 'sawtooth', 0.025); break;
        case 'zap': if (!this.ok('zap', 0.1)) return;
          this.noise(0.25, 1800, 900, 0.07, 'bandpass'); break;
        case 'quack': if (!this.ok('quack', 0.1)) return;
          this.tone(420, 300, 0.12, 'sawtooth', 0.06); this.tone(430, 290, 0.12, 'square', 0.035); break;
        case 'level': if (!this.ok('level', 0.2)) return;
          [523, 659, 784, 1046].forEach((f, i) => this.tone(f, f, 0.18, 'triangle', 0.12, i * 0.07)); break;
        case 'evolve': if (!this.ok('evolve', 0.3)) return;
          [392, 523, 659, 784, 1046, 1318].forEach((f, i) => { this.tone(f, f, 0.3, 'triangle', 0.12, i * 0.06); this.tone(f * 2, f * 2, 0.2, 'sine', 0.04, i * 0.06 + 0.03); }); break;
        case 'pick': if (!this.ok('pick', 0.05)) return;
          this.tone(660, 990, 0.08, 'triangle', 0.1); break;
        case 'click': if (!this.ok('click', 0.04)) return;
          this.tone(900, 700, 0.04, 'triangle', 0.08); break;
        case 'chip': if (!this.ok('chip', 0.05)) return;
          this.tone(1568, 1568, 0.06, 'square', 0.03); this.tone(2093, 2093, 0.1, 'square', 0.03, 0.05); break;
        case 'heal': if (!this.ok('heal', 0.2)) return;
          [660, 880, 1100].forEach((f, i) => this.tone(f, f * 1.02, 0.15, 'sine', 0.09, i * 0.05)); break;
        case 'warn': if (!this.ok('warn', 0.5)) return;
          for (let i = 0; i < 3; i++){ this.tone(220, 196, 0.3, 'sawtooth', 0.08, i * 0.38); this.tone(110, 98, 0.3, 'square', 0.05, i * 0.38); } break;
        case 'roar': if (!this.ok('roar', 0.6)) return;
          this.tone(140, 60, 0.7, 'sawtooth', 0.12); this.noise(0.6, 600, 120, 0.12); break;
        case 'fuse': if (!this.ok('fuse', 0.15)) return;
          this.noise(0.15, 5000, 3000, 0.04, 'highpass'); break;
        case 'win': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.tone(f, f, 0.25, 'triangle', 0.13, i * 0.12)); break;
        case 'lose': [659, 587, 523, 392].forEach((f, i) => this.tone(f, f * 0.97, 0.3, 'triangle', 0.12, i * 0.16)); break;
      }
    } catch (e) {}
  },
  // gentle generative music: pentatonic plucks over a 4-chord loop
  startMusic(){
    if (this.musicTimer || !this.ctx) return;
    this.nextNote = this.ctx.currentTime + 0.1;
    this.musicTimer = setInterval(() => this.schedule(), 90);
  },
  schedule(){
    const c = this.ctx; if (!c || c.state !== 'running') return;
    const spb = 60 / 104 / 2; // eighth notes
    const chords = [[48, 55, 60, 64], [45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 59]];
    const scale = [60, 62, 64, 67, 69, 72, 74, 76, 79];
    while (this.nextNote < c.currentTime + 0.3){
      const t = this.nextNote, b = this.beat; const bar = Math.floor(b / 8) % 4; const ch = chords[bar];
      const mf = m => 440 * Math.pow(2, (m - 69) / 12);
      const step = b % 8;
      try {
        if (step === 0 || step === 4 || (this.intense && step === 6)) this.mnote(mf(ch[0] - 12), t, spb * 3, 'triangle', 0.32);
        if (step === 2 || step === 6) this.mnote(mf(ch[step === 2 ? 1 : 2]), t, spb * 1.5, 'sine', 0.08);
        if (Math.random() < (this.intense ? 0.62 : 0.42)){
          let n = pick(scale); if (Math.random() < 0.5) n = ch[1 + ((Math.random() * 3) | 0)] + 12;
          this.mnote(mf(n), t, spb * 1.8, 'sine', 0.13);
          this.mnote(mf(n) * 2, t + 0.005, spb, 'sine', 0.025);
        }
        if (this.intense && (step % 2 === 1)) this.mhat(t, 0.05);
        if (step === 7 && Math.random() < 0.4) this.mhat(t, 0.04);
      } catch (e) {}
      this.beat++; this.nextNote += spb;
    }
  },
  mnote(f, t, dur, type, vol){
    const c = this.ctx; const o = c.createOscillator(); const g = c.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.mus); o.start(t); o.stop(t + dur + 0.05);
  },
  mhat(t, vol){
    const c = this.ctx; const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(this.mus); s.start(t); s.stop(t + 0.07);
  },
  suspend(){ try { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); } catch (e) {} },
  resume(){ try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} }
};

/* ------------------------------ DRAWING HELPERS ------------------------------ */
function mkCanvas(w, h){
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c;
}
function eyes(g, x, y, sp, s, angry, look){
  look = look || 0;
  for (const dx of [-sp, sp]){
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(x + dx, y, s, s * 1.15, 0, 0, TAU); g.fill();
    g.lineWidth = Math.max(1.5, s * 0.28); g.strokeStyle = INK; g.stroke();
    g.fillStyle = INK; g.beginPath(); g.arc(x + dx + look * s * 0.35, y + s * 0.15, s * 0.5, 0, TAU); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x + dx + look * s * 0.35 - s * 0.15, y - s * 0.05, s * 0.17, 0, TAU); g.fill();
  }
  if (angry){
    g.strokeStyle = INK; g.lineWidth = Math.max(2, s * 0.45); g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - sp - s, y - s * 1.35); g.lineTo(x - sp * 0.25, y - s * 0.75); g.stroke();
    g.beginPath(); g.moveTo(x + sp + s, y - s * 1.35); g.lineTo(x + sp * 0.25, y - s * 0.75); g.stroke();
  }
}
function blobPath(g, x, y, r, bumps, amp, phase){
  g.beginPath();
  const n = 48;
  for (let i = 0; i <= n; i++){
    const a = i / n * TAU; const rr = r * (1 + amp * Math.sin(a * bumps + (phase || 0)));
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
}
function rrect(g, x, y, w, h, r){
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

const SPR = {};
let sprScale = 0;
function buildSprites(scale){
  // bake sprites at (roughly) the on-screen pixel scale so drawing them needs no heavy resampling
  scale = clamp(Math.round((scale || 2) * 4) / 4, 0.75, 3);
  if (scale === sprScale) return; sprScale = scale;
  for (const k of ENAMES){
    const r = ETYPES[k].r; const pad = r * 0.6 + 6; const S = scale;
    const size = (r * 2 + pad * 2);
    const c = mkCanvas(size * S, size * S); const g = c.getContext('2d');
    g.scale(S, S); g.translate(size / 2, size / 2); drawEnemyShape(g, k, r);
    const f = mkCanvas(size * S, size * S); const fg = f.getContext('2d');
    fg.drawImage(c, 0, 0); fg.globalCompositeOperation = 'source-atop'; fg.fillStyle = '#ffffff'; fg.fillRect(0, 0, f.width, f.height);
    SPR[k] = { c, f, size };
  }
}

/* ------------------------------ RUN STATE ------------------------------ */
let state = 'title';
let run = null;
let player = null;
const elist = [];          // active enemies
const efree = [];
const plist = [];          // player projectiles
const pfree = [];
const eplist = [];         // enemy projectiles
const epfree = [];
const pickups = [];
const pkfree = [];
const parts = [];
const partfree = [];
const nums = [];
const numfree = [];
const mines = [];
const fx = [];             // short-lived vector effects (rings, slashes, telegraphs)
const booms = [];          // pending explosions
let uidCounter = 1;

// spatial hash
const CELL = 64;
let GCOLS = 1, GROWS = 1;
let cellHead = new Int32Array(1);
const cellNext = new Int32Array(MAX_ENEMIES + 64);
const bigList = [];
const Q1 = [], Q2 = [];
function gridInit(){
  GCOLS = Math.ceil(WORLD.w / CELL) + 2; GROWS = Math.ceil(WORLD.h / CELL) + 2;
  cellHead = new Int32Array(GCOLS * GROWS);
}
function gridBuild(){
  cellHead.fill(-1); bigList.length = 0;
  for (let i = 0; i < elist.length; i++){
    const e = elist[i];
    if (e.r > 32){ bigList.push(e); continue; }
    const cx = clamp(((e.x / CELL) | 0) + 1, 0, GCOLS - 1), cy = clamp(((e.y / CELL) | 0) + 1, 0, GROWS - 1);
    const c = cy * GCOLS + cx; cellNext[i] = cellHead[c]; cellHead[c] = i;
  }
}
// collect live enemies whose body overlaps circle (x,y,rad)
function query(x, y, rad, out){
  out.length = 0;
  const m = rad + 32;
  const x0 = clamp(((x - m) / CELL | 0) + 1, 0, GCOLS - 1), x1 = clamp(((x + m) / CELL | 0) + 1, 0, GCOLS - 1);
  const y0 = clamp(((y - m) / CELL | 0) + 1, 0, GROWS - 1), y1 = clamp(((y + m) / CELL | 0) + 1, 0, GROWS - 1);
  for (let cy = y0; cy <= y1; cy++){
    for (let cx = x0; cx <= x1; cx++){
      let i = cellHead[cy * GCOLS + cx];
      while (i !== -1){
        const e = elist[i];
        if (!e.dead && e.spawnT <= 0){ const dx = e.x - x, dy = e.y - y, rr = rad + e.r; if (dx * dx + dy * dy < rr * rr) out.push(e); }
        i = cellNext[i];
      }
    }
  }
  for (let k = 0; k < bigList.length; k++){
    const e = bigList[k]; if (e.dead || e.spawnT > 0 || e.air) continue;
    const dx = e.x - x, dy = e.y - y, rr = rad + e.r; if (dx * dx + dy * dy < rr * rr) out.push(e);
  }
  return out.length;
}
function nearestEnemy(x, y, maxD){
  let best = null, bd = maxD * maxD;
  for (let i = 0; i < elist.length; i++){
    const e = elist[i]; if (e.dead || e.spawnT > 0 || e.air) continue;
    const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy;
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}
// nth-nearest-ish random target within range (spread targeting)
function randomEnemyNear(x, y, maxD){
  let cnt = 0, chosen = null;
  for (let i = 0; i < elist.length; i++){
    const e = elist[i]; if (e.dead || e.spawnT > 0 || e.air) continue;
    const dx = e.x - x, dy = e.y - y; if (dx * dx + dy * dy > maxD * maxD) continue;
    cnt++; if (Math.random() * cnt < 1) chosen = e;
  }
  return chosen;
}

function xpNeed(l){ return Math.round(5 + (l - 1) * 5 + Math.pow(l - 1, 2) * 0.28); }
function plv(id){ return run.passives[id] || 0; }
function recalc(){
  const T = run.duck.t, sh = SAVE.shop;
  const p = player;
  const oldMax = p.maxHp;
  p.maxHp = Math.round(100 + 10 * (sh.hp || 0) + (T.hp || 0) + 20 * plv('belly'));
  if (p.maxHp > oldMax && oldMax > 0) p.hp += p.maxHp - oldMax;
  p.hp = Math.min(p.hp, p.maxHp);
  p.speed = 160 * (1 + 0.04 * (sh.spd || 0) + (T.spd || 0) + 0.08 * plv('fins'));
  p.magnet = 60 * (1 + 0.2 * (sh.mag || 0) + (T.mag || 0) + 0.3 * plv('magnet'));
  p.armor = (sh.armor || 0) + (T.armor || 0) + plv('rubber');
  p.regen = 0.15 * (sh.regen || 0) + (T.regen || 0) + 0.3 * plv('warm');
  p.crit = 0.05 + (T.crit || 0) + 0.06 * plv('lucky');
  p.dmgMul = 1 + 0.05 * (sh.dmg || 0) + (T.dmg || 0) + 0.1 * plv('scrub');
  p.cdMul = Math.max(0.35, (1 - 0.03 * (sh.cd || 0)) * (1 - (T.cd || 0)) * (1 - 0.07 * plv('timer')));
  p.areaMul = 1 + (T.area || 0) + 0.1 * plv('foam');

  p.chipMul = 1 + 0.1 * (sh.greed || 0) + (T.chips || 0);

}
function wstats(w){

  return s;
}
function getWeapon(id){ for (const w of run.weapons) if (w.id === id) return w; return null; }

function diffMul(){
  const t = run.time, h = run.heat;
  return {
    hp: (1 + t / 60 * 0.2 + Math.pow(Math.max(0, t - 240) / 60, 1.5) * 0.3) * (1 + 0.3 * h),
    dmg: (1 + t / 600 * 0.9) * (1 + 0.15 * h),
    spd: 1 + Math.min(0.25, t / 2400) + 0.03 * h
  };
}
function spawnEnemy(type, x, y, opt){
  if (elist.length >= MAX_ENEMIES && !(opt && opt.force)) return null;
  const T = ETYPES[type]; const D = diffMul();
  const e = efree.pop() || { hcd: new Float32Array(12) };
  e.uid = uidCounter++; e.type = type; e.x = x; e.y = y; e.vx = 0; e.vy = 0; e.kx = 0; e.ky = 0;
  e.elite = !!(opt && opt.elite); e.boss = !!T.boss;
  const em = e.elite ? 1.45 : 1;
  e.r = T.r * em; e.spd = T.spd * D.spd * (e.elite ? 0.9 : 1) * rand(0.92, 1.08);
  e.maxhp = e.hp = T.hp * (T.boss ? (1 + 0.35 * run.heat) : D.hp) * (e.elite ? 7 : 1);
  e.dmg = T.dmg * D.dmg * (e.elite ? 1.4 : 1); e.xp = T.xp * (e.elite ? 8 : 1); e.kbm = T.kb * (e.elite ? 0.4 : 1); e.armor = T.armor || 0;
  e.dead = false; e.flash = 0; e.stun = 0; e.state = 0; e.t = rand(0, 1); e.t2 = 0; e.spawnT = opt && opt.instant ? 0 : 0.45; e.wob = Math.random() * TAU;
  e.face = 1; e.air = false; e.ax = 0; e.ay = 0; e.squash = 0; e.phase = 0; e.cnt = 0; e.slow = 0;
  e.hcd.fill(0);
  if (opt && opt.vx !== undefined){ e.vx = opt.vx; e.vy = opt.vy; }
  elist.push(e);
  return e;
}
function viewRadius(){ return Math.hypot(cam.vw, cam.vh) / 2; }
function spawnPos(extra){
  const R = viewRadius() + 30 + (extra || 0);
  for (let k = 0; k < 6; k++){
    const a = Math.random() * TAU;
    const x = clamp(player.x + Math.cos(a) * R, 30, WORLD.w - 30), y = clamp(player.y + Math.sin(a) * R, 30, WORLD.h - 30);
    if (Math.hypot(x - player.x, y - player.y) > 260) return [x, y];
  }
  // fallback: far corner relative to player
  return [player.x < WORLD.w / 2 ? WORLD.w - 40 : 40, player.y < WORLD.h / 2 ? WORLD.h - 40 : 40];
}
function pickType(){
  const t = run.time, m = t / 60;
  const w = [['suds', Math.max(3, 10 - m * 0.6)]];
  if (t > 25) w.push(['bubble', 2]);
  if (t > 40) w.push(['sponge', 2.5 + m * 0.7]);
  if (t > 75) w.push(['fizzer', 2 + m * 0.5]);
  if (t > 110) w.push(['sock', 1.6 + m * 0.6]);
  if (t > 190){ let tur = 0; for (const e of elist) if (e.type === 'turret' && !e.dead) tur++; if (tur < 3 + m * 0.6) w.push(['turret', 0.6 + m * 0.12]); }
  if (t > 230) w.push(['loofah', 1 + m * 0.55]);
  return wpick(w);
}
function director(dt){
  const t = run.time, h = run.heat;
  // boss schedule
  const nb = RUN_BOSSES[run.bossIdx];
  if (nb){
    if (t >= nb.t - 4 && run.bossWarned !== run.bossIdx){
      run.bossWarned = run.bossIdx; Snd.play('warn');
      showBanner(ETYPES[nb.id].name, nb.id === 'king' ? 'The final boss approaches!' : 'is coming!', true);
    }
    if (t >= nb.t){ spawnBoss(nb.id); run.bossIdx++; }
  }
  const bossAlive = run.bosses.some(b => !b.dead);
  let rate = (0.9 + t * 0.02 + Math.max(0, t - 360) * 0.012) * (1 + 0.12 * h);
  if (t > 720) rate *= 1 + (t - 720) / 60 * 0.6;
  if (bossAlive) rate *= 0.45;
  if (t < 8) rate = 0.6;
  const maxAlive = Math.min(MAX_ENEMIES - 30, 16 + t * 0.5 + h * 12);
  run.spawnAcc += rate * dt;
  let guard = 0;
  while (run.spawnAcc >= 1 && guard++ < 20){
    run.spawnAcc -= 1;
    if (elist.length >= maxAlive) { run.spawnAcc = Math.min(run.spawnAcc, 2); break; }
    const type = pickType(); const [x, y] = spawnPos();
    const eliteCh = t > 150 ? 0.008 + (t / 60) * 0.004 : 0;
    spawnEnemy(type, x, y, { elite: Math.random() < eliteCh && type !== 'bubble' });
  }
  // bubble swarms
  run.swarmT -= dt;
  if (run.swarmT <= 0){
    run.swarmT = rand(18, 26) * (bossAlive ? 1.6 : 1);
    const n = Math.min(26, 5 + Math.floor(t / 35));
    const [x, y] = spawnPos(40);
    const a = Math.atan2(player.y - y, player.x - x);
    const s = ETYPES.bubble.spd * diffMul().spd;
    for (let i = 0; i < n; i++){
      const ox = rand(-60, 60), oy = rand(-60, 60);
      const e = spawnEnemy(t > 400 && i % 4 === 0 ? 'lint' : 'bubble', clamp(x + ox, 20, WORLD.w - 20), clamp(y + oy, 20, WORLD.h - 20), { vx: Math.cos(a) * s, vy: Math.sin(a) * s });
      if (e && e.type === 'bubble'){ e.state = 1; e.t = 9; }
    }
  }
  // encirclement events
  for (const rt of [255, 435, 615]){
    if (t >= rt && !run.ringsDone[rt]){
      run.ringsDone[rt] = 1;
      const type = rt < 300 ? 'suds' : rt < 500 ? 'sponge' : 'loofah';
      const n = rt < 300 ? 30 : rt < 500 ? 26 : 22;
      const R = Math.min(viewRadius() * 0.9, 470);
      showHint('Surrounded! Punch a hole and swim out!', 2.6);
      for (let i = 0; i < n; i++){
        const a = i / n * TAU;
        spawnEnemy(type, clamp(player.x + Math.cos(a) * R, 20, WORLD.w - 20), clamp(player.y + Math.sin(a) * R, 20, WORLD.h - 20), { force: true });
      }
    }
  }
}
function spawnBoss(id){
  const [x, y] = spawnPos(-60);
  const e = spawnEnemy(id, x, y, { force: true });
  if (!e) return;
  e.spawnT = 0.9; e.state = 0; e.t = 2.5;
  run.bosses.push(e);
  Snd.play('roar'); addShake(8);
  if (id === 'king'){ for (let i = 0; i < 4; i++){ const a = i / 4 * TAU; spawnEnemy('loofah', clamp(x + Math.cos(a) * 120, 20, WORLD.w - 20), clamp(y + Math.sin(a) * 120, 20, WORLD.h - 20), { force: true, elite: run.heat > 0 }); } }
}

function hurtEnemy(e, dmg, src, kx, ky, kb, noCrit){
  if (e.dead) return 0;
  let crit = false;
  if (!noCrit && Math.random() < player.crit){ crit = true; dmg *= 2; }
  dmg *= (1 - e.armor);
  if (e.air) return 0;
  e.hp -= dmg; e.flash = 0.1; e.squash = 0.25;
  if (kb && e.kbm > 0){ e.kx += kx * kb * e.kbm; e.ky += ky * kb * e.kbm; }
  run.dmgBy[src] = (run.dmgBy[src] || 0) + Math.min(dmg, dmg + e.hp);
  dmgNum(e.x, e.y - e.r * 0.6, dmg, crit);
  if (e.hp <= 0) killEnemy(e, src);
  else if (Math.random() < 0.35) Snd.play('hit');
  return dmg;
}
const DEATH_COL = { suds: '#ffffff', bubble: '#bfefff', sponge: '#ffd84d', fizzer: '#ff9ec7', sock: '#9cc6ff', lint: '#d8cfe8', loofah: '#ffb27a', turret: '#7fe0c0' };
function killEnemy(e, src){
  if (e.dead) return;

  const T = ETYPES[e.type];
  // drops
  if (e.boss){
    bossDeath(e); return;
  }
  let xp = e.xp;
  if (xp >= 20) { dropPickup('pearl', e.x, e.y, Math.round(xp * 0.6)); dropPickup('pearl', e.x, e.y, Math.round(xp * 0.4)); }
  else dropPickup('pearl', e.x, e.y, xp);
  const r = Math.random();
  if (e.elite){
    run.elitesKilled++;
    dropPickup('chip', e.x, e.y, 3 + randi(0, 3));
    dropPickup(Math.random() < 0.45 ? 'chest' : 'heal', e.x + 14, e.y, 1);
  } else if (r < 0.006) dropPickup('heal', e.x, e.y, 1);
  else if (r < 0.0075 && run.time > 60) dropPickup('vacuum', e.x, e.y, 1);

  // effects
  const col = DEATH_COL[e.type] || '#fff';
  burst(e.x, e.y, e.elite ? 16 : 7, col, 160, e.r * 0.35, 0.45);
  if (parts.length < MAX_PARTS - 2) part(e.x, e.y, 0, 0, 0.25, e.r * 1.2, '#ffffff', 2);
  Snd.play(e.r > 18 ? 'bigpop' : 'pop', 1 + (24 - e.r) / 40);
  if (e.type === 'fizzer') booms.push({ x: e.x, y: e.y, rad: 78 * (e.elite ? 1.4 : 1), dmg: 30 + run.time * 0.05, src: 'fizz', delay: 0.06, hurtP: e.state === 2 ? e.dmg * 1.6 : 0, col: '#ff9ec7' });
  if (e.type === 'sock'){
    const n = e.elite ? 5 : 2 + (Math.random() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++){ const a = i / n * TAU + rand(0, 1); const l = spawnEnemy('lint', clamp(e.x + Math.cos(a) * 12, 10, WORLD.w - 10), clamp(e.y + Math.sin(a) * 12, 10, WORLD.h - 10), { instant: true }); if (l){ l.kx = Math.cos(a) * 220; l.ky = Math.sin(a) * 220; } }
  }
}
function bossDeath(e){

    eplist.length = 0;

function hurtPlayer(d){
  if (player.inv > 0 || !player.alive || run.won) return;
  d = Math.max(1, d - player.armor);
  player.hp -= d; player.inv = 0.45; player.hurtT = 0.3; player.squash = 0.4;

function updateEnemies(dt){
  const px = player.x, py = player.y, pr = player.r;
  const t = run.time;
  for (let i = 0; i < elist.length; i++){
    const e = elist[i]; if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.squash > 0) e.squash -= dt;
    e.wob += dt * 6;
    if (e.spawnT > 0){ e.spawnT -= dt; continue; }
    // knockback velocity
    e.x += e.kx * dt; e.y += e.ky * dt;
    const kd = Math.pow(0.0015, dt); e.kx *= kd; e.ky *= kd;
    if (e.stun > 0){ e.stun -= dt; continue; }
    let dx = px - e.x, dy = py - e.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    let mx = dx, my = dy, sp = e.spd;
    switch (e.type){
      case 'bubble':
        if (e.state === 1){ // swarm: straight flight with weak homing
          e.t -= dt;
          const a = Math.atan2(e.vy, e.vx), ta = Math.atan2(dy, dx);
          let da = ta - a; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
          const na = a + clamp(da, -0.35 * dt, 0.35 * dt); const s = Math.hypot(e.vx, e.vy);
          e.vx = Math.cos(na) * s; e.vy = Math.sin(na) * s;
          e.x += e.vx * dt; e.y += e.vy * dt;
          if (e.t <= 0 || e.x < -60 || e.y < -60 || e.x > WORLD.w + 60 || e.y > WORLD.h + 60){ e.dead = true; continue; }
          mx = 0; my = 0; sp = 0;
        } else { mx = dx + Math.sin(e.wob * 0.5) * 0.4; my = dy + Math.cos(e.wob * 0.5) * 0.4; }
        break;
      case 'sponge':
        e.t -= dt;
        if (e.state === 0){ if (d < 240 && e.t <= 0){ e.state = 1; e.t = 0.6; e.ax = dx; e.ay = dy; } }
        else if (e.state === 1){ sp = 0; if (e.t <= 0){ e.state = 2; e.t = 0.42; } }
        else if (e.state === 2){ mx = e.ax; my = e.ay; sp = e.spd * 4.2; if (e.t <= 0){ e.state = 3; e.t = 0.7; } }
        else { sp = e.spd * 0.35; if (e.t <= 0){ e.state = 0; e.t = rand(0.8, 1.6); } }
        break;
      case 'fizzer':
        if (e.state === 0 && d < 66){ e.state = 2; e.t = 0.85; Snd.play('fuse'); }
        if (e.state === 2){ sp = e.spd * 0.3; e.t -= dt; if (e.t <= 0){ killEnemy(e, 'fizz'); continue; } }
        break;
      case 'sock': { const s = Math.sin(e.wob * 0.9) * 0.8; mx = dx - dy * s; my = dy + dx * s; break; }
      case 'turret':
        e.t -= dt;
        if (e.state === 0){ if (d < 340){ e.state = 1; e.t = rand(0.6, 1.4); } }
        else { sp = 0; if (d > 560) e.state = 0;
          if (e.t <= 0){ e.t = 2.3; const s = 180; e.squash = 0.3;
            enemyShot('goo', e.x, e.y - e.r * 0.5, dx * s, dy * s, 9, e.dmg, 4);
            if (e.elite){ for (const o of [-0.3, 0.3]){ const a = Math.atan2(dy, dx) + o; enemyShot('goo', e.x, e.y, Math.cos(a) * s, Math.sin(a) * s, 9, e.dmg, 4); } }
          } }
        break;
      case 'megasponge': case 'drain': case 'bigfizz': case 'king':
        bossAI(e, dt, dx, dy, d); mx = e.mx; my = e.my; sp = e.msp; break;
    }
    if (sp > 0){
      const ml = Math.hypot(mx, my) || 1;
      e.x += mx / ml * sp * dt; e.y += my / ml * sp * dt;
    }
    if (Math.abs(mx) > 0.15) e.face = mx > 0 ? 1 : -1;
    // separation against neighbours (from last step's grid)
    if (!e.boss && !(e.type === 'bubble' && e.state === 1)){

          const xx = cx + ox; if (xx < 0 || xx >= GCOLS) continue;
          let j = cellHead[yy * GCOLS + xx];
          while (j !== -1 && checked < 8){
            const o = elist[j];
            if (o && o !== e && !o.dead){
              checked++;

            }

      }
    }
  }
}

        }

    case 'bigfizz':

/* ------------------------------ PLAYER UPDATE ------------------------------ */
const input = { jx: 0, jy: 0, jActive: false, ox: 0, oy: 0, cx: 0, cy: 0, pid: -1, keys: {}, mouseX: 0, mouseY: 0, mouseIn: false,
  tapActive: false, tapHas: false, tapSX: 0, tapSY: 0, tapWX: 0, tapWY: 0,
  swX: 0, swY: 0, swSX: 0, swSY: 0, swT: 0, swMoved: false,
  tilt: { has: false, cal: true, b: 0, g: 0, b0: 0, g0: 0 } };
function ctrlMode(){ return SAVE.settings.ctrl || 'float'; }
function tiltVec(){
  const T = input.tilt; if (!T.has) return null;
  let db = T.b - T.b0, dg = T.g - T.g0;
  let ang = 0; try { ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0; } catch (e) {}
  ang = ((ang % 360) + 360) % 360;
  let x = dg, y = db;
  if (ang === 90){ x = db; y = -dg; } else if (ang === 270){ x = -db; y = dg; } else if (ang === 180){ x = -dg; y = -db; }
  const d = Math.hypot(x, y), dead = 2.5, full = 16;
  if (d < dead) return [0, 0];
  const m = Math.min(1, (d - dead) / (full - dead));
  return [x / d * m, y / d * m];
}
window.addEventListener('deviceorientation', ev => {
  if (ev.beta == null || ev.gamma == null) return;
  const T = input.tilt; T.has = true; T.b = ev.beta; T.g = ev.gamma;
  if (T.cal){ T.b0 = T.b; T.g0 = T.g; T.cal = false; }
});
function updatePlayer(dt){
  const p = player;
  if (!p.alive){ p.deadT += dt; return; }
  let mx = 0, my = 0;
  const k = input.keys;
  if (k.ArrowLeft || k.KeyA) mx -= 1; if (k.ArrowRight || k.KeyD) mx += 1;
  if (k.ArrowUp || k.KeyW) my -= 1; if (k.ArrowDown || k.KeyS) my += 1;
  if (mx || my){ const l = Math.hypot(mx, my); mx /= l; my /= l; }
  else if (input.jActive){ mx = input.jx; my = input.jy; }
  else if (ctrlMode() === 'tap' && input.tapHas){
    if (input.tapActive){ input.tapWX = (input.tapSX - W / 2) / cam.scale + cam.x; input.tapWY = (input.tapSY - H / 2) / cam.scale + cam.y; }
    const dx = input.tapWX - p.x, dy = input.tapWY - p.y, d = Math.hypot(dx, dy);
    if (d > 8){ const f = Math.min(1, (d - 4) / 40); mx = dx / d * f; my = dy / d * f; }
    else if (!input.tapActive) input.tapHas = false;
  }
  else if (ctrlMode() === 'swipe' && (input.swX || input.swY)){ mx = input.swX; my = input.swY; }
  else if (ctrlMode() === 'tilt' && input.tilt.has){ const v = tiltVec(); mx = v[0]; my = v[1]; }
  else if (SAVE.settings.follow && input.mouseIn){
    const wx = (input.mouseX - W / 2) / cam.scale + cam.x, wy = (input.mouseY - H / 2) / cam.scale + cam.y;
    const dx = wx - p.x, dy = wy - p.y, d = Math.hypot(dx, dy);
    if (d > 24){ const f = Math.min(1, (d - 24) / 80); mx = dx / d * f; my = dy / d * f; }
  }
  if (bot) { const b = bot(dt); mx = b[0]; my = b[1]; }
  const tvx = mx * p.speed, tvy = my * p.speed;
  const acc = 1 - Math.pow(0.0001, dt);
  p.vx = lerp(p.vx, tvx, acc); p.vy = lerp(p.vy, tvy, acc);
  p.x = clamp(p.x + p.vx * dt, p.r + 8, WORLD.w - p.r - 8); p.y = clamp(p.y + p.vy * dt, p.r + 8, WORLD.h - p.r - 8);
  const sp = Math.hypot(p.vx, p.vy);
  if (Math.abs(p.vx) > 15) p.face = p.vx > 0 ? 1 : -1;
  if (sp > 20){ p.aimX = p.vx / sp; p.aimY = p.vy / sp; run.moved += sp * dt; }
  p.bob += dt * (3 + sp / 60);
  if (p.inv > 0) p.inv -= dt;
  if (p.hurtT > 0) p.hurtT -= dt;
  if (p.squash > 0) p.squash -= dt;
  p.blinkT -= dt; if (p.blinkT < -0.12) p.blinkT = rand(1.5, 4);
  if (p.regen > 0 && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
  p.rippleT -= dt;
  if (sp > 40 && p.rippleT <= 0){ p.rippleT = 0.12; part(p.x - p.vx / sp * 14, p.y - p.vy / sp * 14 + 6, -p.vx * 0.1, -p.vy * 0.1, 0.6, 6, 'rgba(255,255,255,.6)', 1); }
}

function canHit(e, slot, cd){

}
function updateWeapons(dt){

function doShock(s, A, evo){

  const cnt = query(p.x, p.y, R, Q1);
  for (let q = 0; q < cnt; q++){ const e = Q1[q]; const ka = Math.atan2(e.y - p.y, e.x - p.x); hurtEnemy(e, dmgOf(s.dmg), 'shock', Math.cos(ka), Math.sin(ka), s.kb); if (s.stun) e.stun = Math.max(e.stun, s.stun); }
  // shockwaves also pop goo blobs
  for (const b of eplist){ if (Math.hypot(b.x - p.x, b.y - p.y) < R) b.dead = true; }
  p.squash = 0.35;
  Snd.play('squeak'); addShake(evo ? 3 : 1.5);
}
function doWhip(s, A, dir){
  const p = player; const len = s.len * A, h = s.h * A;
  fx.push({ k: 'whip', x: p.x, y: p.y, dir, len, h, t: 0, life: 0.2 });
  const cx = p.x + dir * len / 2;
  const cnt = query(cx, p.y, Math.hypot(len / 2, h / 2), Q1);
  for (let q = 0; q < cnt; q++){
    const e = Q1[q];
    if (Math.abs(e.x - cx) < len / 2 + e.r && Math.abs(e.y - p.y) < h / 2 + e.r){ hurtEnemy(e, dmgOf(s.dmg), 'whip', dir, 0, 180); }
  }
  Snd.play('whip');
}
function beamHit(x, y, ang, len, wid, dmg, src){
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const steps = Math.ceil(len / 90);
  const seen = Q2; seen.length = 0;
  for (let i = 0; i < steps; i++){
    const t0 = (i + 0.5) * len / steps;
    const cnt = query(x + ux * t0, y + uy * t0, len / steps / 2 + wid, Q1);
    for (let q = 0; q < cnt; q++){
      const e = Q1[q]; if (seen.indexOf(e) >= 0) continue;
      const rx = e.x - x, ry = e.y - y; const along = rx * ux + ry * uy; if (along < -e.r || along > len + e.r) continue;
      const perp = Math.abs(rx * uy - ry * ux); if (perp > wid / 2 + e.r) continue;
      seen.push(e);
    }
  }
  const list = seen.slice();
  for (const e of list) hurtEnemy(e, dmg, src, ux, uy, 50);
  if (Math.random() < 0.6) part(x + ux * len * rand(0.3, 1), y + uy * len * rand(0.3, 1), rand(-60, 60), rand(-60, 60), 0.4, 5, '#dff8ff', 0);
}

/* ------------------------------ PROJECTILES ------------------------------ */
function updateProjectiles(dt){
  const p = player;
  for (let i = 0; i < plist.length; i++){
    const b = plist[i]; if (b.dead) continue;
    b.life -= dt; b.t += dt;
    if (b.kind === 'duckling'){
      if (!b.target || b.target.dead || b.t % 0.5 < dt) b.target = randomEnemyNear(b.x, b.y, 420) || nearestEnemy(b.x, b.y, 700);
      if (b.target){
        const ta = Math.atan2(b.target.y - b.y, b.target.x - b.x); let a = Math.atan2(b.vy, b.vx); let da = ta - a;
        while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
        a += clamp(da, -7 * dt, 7 * dt); const sp = Math.min(b.spd, Math.hypot(b.vx, b.vy) + 600 * dt);
        b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
      }
    } else if (b.kind === 'soap'){
      b.spin += dt * 16;
      const sp = Math.hypot(b.vx, b.vy);
      if (!b.back){ b.dist += sp * dt; const f = 1 - b.dist / b.range; const s = Math.max(60, 520 * f); b.vx = Math.cos(b.ang) * s; b.vy = Math.sin(b.ang) * s; if (b.dist >= b.range) b.back = true; }
      else { const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy) || 1; const s = Math.min(560, Math.hypot(b.vx, b.vy) + 900 * dt); b.vx = dx / d * s; b.vy = dy / d * s; if (d < 20) b.dead = true; }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.life <= 0 || b.x < -50 || b.y < -50 || b.x > WORLD.w + 50 || b.y > WORLD.h + 50){ b.dead = true; continue; }
    const cnt = query(b.x, b.y, b.r, Q1);
    for (let q = 0; q < cnt && !b.dead; q++){
      const e = Q1[q];
      if (b.kind === 'soap'){
        if (canHit(e, WIDX.soap, 0.4)){ const ka = Math.atan2(b.vy, b.vx); hurtEnemy(e, b.dmg, b.src, Math.cos(ka), Math.sin(ka), 110); }
        continue;
      }
      if (b.hits.indexOf(e.uid) >= 0) continue;
      b.hits.push(e.uid);
      const sp = Math.hypot(b.vx, b.vy) || 1;
      hurtEnemy(e, b.dmg, b.src, b.vx / sp, b.vy / sp, b.kind === 'bubble' ? 90 : 120);
      if (b.boom){ booms.push({ x: b.x, y: b.y, rad: b.boom, dmg: b.dmg * 0.6, src: b.src, delay: 0, hurtP: 0, col: '#fff07a' }); }
      burst(b.x, b.y, 3, b.kind === 'duckling' ? '#fff07a' : '#dff8ff', 90, 4, 0.25);
      b.pierce--;
      if (b.pierce <= 0) b.dead = true;
    }
  }
  // compact
  let j = 0;
  for (let i = 0; i < plist.length; i++){ const b = plist[i]; if (b.dead){ pfree.push(b); } else plist[j++] = b; }
  plist.length = j;

  for (let i = 0; i < eplist.length; i++){
    const b = eplist[i]; if (b.dead) continue;
    b.life -= dt; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.life <= 0 || b.x < -40 || b.y < -40 || b.x > WORLD.w + 40 || b.y > WORLD.h + 40){ b.dead = true; continue; }
    const dx = b.x - p.x, dy = b.y - p.y, rr = b.r + p.r * 0.7;
    if (p.alive && dx * dx + dy * dy < rr * rr){ b.dead = true; hurtPlayer(b.dmg); burst(b.x, b.y, 5, '#7fe0c0', 100, 4, 0.3); }
  }
  j = 0;
  for (let i = 0; i < eplist.length; i++){ const b = eplist[i]; if (b.dead) epfree.push(b); else eplist[j++] = b; }
  eplist.length = j;
}
function updateMines(dt){
  for (const m of mines){
    if (m.dead) continue;
    m.life -= dt; m.t += dt; if (m.pop > 0) m.pop -= dt;
    if (m.life <= 0){ m.dead = true; continue; }
    if (m.arm > 0){ m.arm -= dt; continue; }
    if (query(m.x, m.y, 16, Q1) > 0) detonate(m);
  }
  let j = 0; for (let i = 0; i < mines.length; i++) if (!mines[i].dead) mines[j++] = mines[i]; mines.length = j;
}
function detonate(m){
  if (m.dead) return; m.dead = true;
  booms.push({ x: m.x, y: m.y, rad: m.rad, dmg: m.dmg, src: 'mines', delay: 0, hurtP: 0, col: '#9fe8b8', stun: m.stun });
  if (m.evo){ for (const o of mines){ if (!o.dead && o.arm <= 0 && Math.hypot(o.x - m.x, o.y - m.y) < m.rad * 1.3){ o.dead = true; booms.push({ x: o.x, y: o.y, rad: o.rad, dmg: o.dmg, src: 'mines', delay: 0.12, hurtP: 0, col: '#9fe8b8', stun: o.stun }); } } }
}
function updateBooms(dt){
  for (let i = 0; i < booms.length; i++){
    const b = booms[i]; b.delay -= dt; if (b.delay > 0) continue;
    b.done = true;
    ringFx(b.x, b.y, b.rad * 0.3, b.rad, 0.3, b.col, 6);
    burst(b.x, b.y, 10, b.col, b.rad * 3, 6, 0.4);
    if (parts.length < MAX_PARTS) part(b.x, b.y, 0, 0, 0.18, b.rad * 0.9, '#ffffff', 2);
    Snd.play(b.src === 'mines' ? 'boom' : 'splash'); addShake(b.src === 'fizz' ? 2 : 2.5);
    const cnt = query(b.x, b.y, b.rad, Q2); const list = Q2.slice(0, cnt);
    for (const e of list){ const a = Math.atan2(e.y - b.y, e.x - b.x); hurtEnemy(e, b.src === 'fizz' ? b.dmg * player.dmgMul : b.dmg, b.src, Math.cos(a), Math.sin(a), 200, b.src === 'fizz'); if (b.stun) e.stun = Math.max(e.stun, b.stun); }
    if (b.hurtP && Math.hypot(player.x - b.x, player.y - b.y) < b.rad + player.r * 0.5) hurtPlayer(b.hurtP);
  }
  let j = 0; for (let i = 0; i < booms.length; i++) if (!booms[i].done) booms[j++] = booms[i]; booms.length = j;
}

/* ------------------------------ PICKUPS ------------------------------ */
function updatePickups(dt){
  const p = player; const mag = p.magnet;
  const drain = run.bosses.find(b => b.type === 'drain' && !b.dead);
  for (let i = 0; i < pickups.length; i++){
    const k = pickups[i]; if (k.dead) continue;
    k.t += dt;
    const dx = p.x - k.x, dy = p.y - k.y, d = Math.hypot(dx, dy) || 1;
    if (k.kind !== 'chest' && (d < mag || k.mag)) k.mag = true;
    if (k.kind === 'chest' && d < 34) k.mag = true;
    if (k.mag && p.alive){
      const s = 260 + k.t * 300;
      k.vx = lerp(k.vx, dx / d * s, 1 - Math.pow(0.001, dt)); k.vy = lerp(k.vy, dy / d * s, 1 - Math.pow(0.001, dt));
    } else { const f = Math.pow(0.02, dt); k.vx *= f; k.vy *= f;
      if (drain && k.kind === 'pearl'){ const ddx = drain.x - k.x, ddy = drain.y - k.y, dd = Math.hypot(ddx, ddy) || 1; if (dd < 500){ k.x += ddx / dd * 30 * dt; k.y += ddy / dd * 30 * dt; } } }
    k.x += k.vx * dt; k.y += k.vy * dt;
    if (d < p.r + 10 && p.alive) collect(k);
  }
  let j = 0; for (let i = 0; i < pickups.length; i++){ const k = pickups[i]; if (k.dead) pkfree.push(k); else pickups[j++] = k; }
  pickups.length = j;
}
let pearlPitch = 0, pearlPitchT = 0;
function collect(k){
  k.dead = true;
  switch (k.kind){
    case 'pearl':
      gainXp(k.v);
      pearlPitch = pearlPitchT > 0 ? Math.min(pearlPitch + 1, 14) : 0; pearlPitchT = 0.35;
      Snd.play('pearl', Math.pow(2, pearlPitch / 12));
      if (!run.firstPearl){ run.firstPearl = true; }
      break;
    case 'heal': player.hp = Math.min(player.maxHp, player.hp + 30); Snd.play('heal'); dmgNum(player.x, player.y - 24, 30, false, '#6fdcae'); burst(player.x, player.y, 10, '#6fdcae', 120, 5, 0.5); break;
    case 'chip': run.chipsFound += k.v; Snd.play('chip'); break;
    case 'vacuum': for (const o of pickups) if (o.kind === 'pearl') o.mag = true; Snd.play('evolve'); ringFx(player.x, player.y, 10, 600, 0.5, '#bfefff', 8); break;
    case 'chest': openChest(k.v, !!k.boss); break;
  }
}
function gainXp(v){
  run.xp += v * player.xpMul;
  while (run.xp >= run.need){ run.xp -= run.need; run.level++; run.need = xpNeed(run.level); run.pendingLv++; }
}

/* ------------------------------ PARTICLES ------------------------------ */
function updateParts(dt){
  let j = 0;
  for (let i = 0; i < parts.length; i++){
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0){ partfree.push(p); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; const f = Math.pow(0.05, dt); p.vx *= f; p.vy *= f; p.rot += dt * 4;
    parts[j++] = p;
  }
  parts.length = j;
  j = 0;
  for (let i = 0; i < nums.length; i++){ const n = nums[i]; n.t += dt; n.y += n.vy * dt; n.vy *= Math.pow(0.1, dt); if (n.t >= n.life){ numfree.push(n); continue; } nums[j++] = n; }
  nums.length = j;
  j = 0;
  for (let i = 0; i < fx.length; i++){ const f = fx[i]; f.t += dt; if (f.e){ f.x = f.e.x; f.y = f.e.y; } if (f.t < f.life) fx[j++] = f; }
  fx.length = j;
}

/* ------------------------------ STEP ------------------------------ */
function compactEnemies(){
  let j = 0;
  for (let i = 0; i < elist.length; i++){ const e = elist[i]; if (e.dead){ efree.push(e); } else elist[j++] = e; }
  elist.length = j;
  for (let i = run.bosses.length - 1; i >= 0; i--) if (run.bosses[i].dead && !run.bosses[i].shown) run.bosses[i].shown = true;
}
function step(dt){
  run.time += run.won ? 0 : dt;
  if (run.won){ run.winT -= dt; if (run.winT <= 0 && !run.over){ endRun(true); return; } }
  if (!player.alive && player.deadT > 1.5 && !run.over){ endRun(false); return; }
  if (pearlPitchT > 0) pearlPitchT -= dt;
  updatePlayer(dt);
  if (player.alive && !run.won) director(dt);
  updateEnemies(dt);
  compactEnemies();
  gridBuild();
  updateWeapons(dt);
  updateProjectiles(dt);
  updateMines(dt);
  updateBooms(dt);
  updatePickups(dt);
  updateParts(dt);
  updateHints(dt);
  // camera
  const lead = 0.25;
  cam.x = lerp(cam.x, player.x + player.vx * lead, 1 - Math.pow(0.002, dt));
  cam.y = lerp(cam.y, player.y + player.vy * lead, 1 - Math.pow(0.002, dt));
  const mxw = 140;
  if (cam.vw > WORLD.w + mxw * 2) cam.x = WORLD.w / 2; else cam.x = clamp(cam.x, cam.vw / 2 - mxw, WORLD.w - cam.vw / 2 + mxw);
  if (cam.vh > WORLD.h + mxw * 2) cam.y = WORLD.h / 2; else cam.y = clamp(cam.y, cam.vh / 2 - mxw, WORLD.h - cam.vh / 2 + mxw);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  Snd.intense = run.bosses.some(b => !b.dead) || run.time > 420 ? 1 : 0;
}

/* ------------------------------ LEVEL UP / CARDS ------------------------------ */
const MAXW = 6, MAXP = 6;
function canEvolve(w){ return !w.evo && w.lv >= 5 && plv(WEAPONS[w.id].evo) >= 5; }
function buildOptions(n){
  const opts = [];
  for (const w of run.weapons){
    if (canEvolve(w)) opts.push({ kind: 'evo', id: w.id, wt: 6 });
    else if (!w.evo && w.lv < 5) opts.push({ kind: 'wup', id: w.id, wt: 3 });
  }
  if (run.weapons.length < MAXW) for (const id of WIDS) if (!getWeapon(id)) opts.push({ kind: 'wnew', id, wt: run.weapons.length < 3 ? 2.2 : 1.2 });
  for (const id of PIDS){
    const l = plv(id);
    if (l > 0 && l < 5) opts.push({ kind: 'pup', id, wt: 2.2 });
    else if (l === 0 && run.passOrder.length < MAXP) opts.push({ kind: 'pnew', id, wt: 1.3 + (EVO_OF_PASSIVE[id] && getWeapon(EVO_OF_PASSIVE[id]) ? 1 : 0) });
  }
  const out = [];
  // guaranteed evolution if available
  const evo = opts.find(o => o.kind === 'evo'); if (evo){ out.push(evo); opts.splice(opts.indexOf(evo), 1); }
  while (out.length < n && opts.length){
    let s = 0; for (const o of opts) s += o.wt; let r = Math.random() * s; let idx = 0;
    for (; idx < opts.length; idx++){ r -= opts[idx].wt; if (r <= 0) break; }
    idx = Math.min(idx, opts.length - 1);
    out.push(opts[idx]); opts.splice(idx, 1);
  }
  if (!out.length){ out.push({ kind: 'snack', id: 'heal' }); out.push({ kind: 'chips', id: 'chip' }); }
  return shuffle(out);
}
function cardInfo(o){
  switch (o.kind){
    case 'evo': { const D = WEAPONS[o.id]; return { icon: o.id, name: D.evoName, tag: 'Evolution!', desc: D.evoDesc, cls: 'evo' }; }
    case 'wup': { const w = getWeapon(o.id); const D = WEAPONS[o.id]; return { icon: o.id, name: D.name, tag: 'Level ' + (w.lv + 1), desc: D.desc[w.lv], cls: '', pair: w.lv + 1 === 5 ? 'Evolves with ' + PASSIVES[D.evo].name + ' at level 5' : '' }; }
    case 'wnew': { const D = WEAPONS[o.id]; return { icon: o.id, name: D.name, tag: 'New weapon', desc: D.desc[0], cls: 'new', pair: 'Evolves with ' + PASSIVES[D.evo].name }; }
    case 'pup': { const P = PASSIVES[o.id]; return { icon: o.id, name: P.name, tag: 'Level ' + (plv(o.id) + 1), desc: P.desc, cls: '', pair: pairText(o.id) }; }
    case 'pnew': { const P = PASSIVES[o.id]; return { icon: o.id, name: P.name, tag: 'New passive', desc: P.desc, cls: 'new', pair: pairText(o.id) }; }
    case 'snack': return { icon: 'heal', name: 'Fizzy Snack', tag: 'Treat', desc: 'Heal 30 health.', cls: '' };
    case 'chips': return { icon: 'chip', name: 'Chip Stash', tag: 'Treat', desc: '+15 rubber chips.', cls: '' };
  }
}
function pairText(pid){ const w = EVO_OF_PASSIVE[pid]; return w ? 'Evolves ' + WEAPONS[w].name : 'Boosts every weapon'; }
function applyOption(o){
  switch (o.kind){
    case 'evo': evolve(o.id); break;
    case 'wup': getWeapon(o.id).lv++; break;
    case 'wnew': addWeapon(o.id); break;
    case 'pup': run.passives[o.id]++; if (o.id === 'belly') player.hp += 20; break;
    case 'pnew': run.passives[o.id] = 1; run.passOrder.push(o.id); if (o.id === 'belly') player.hp += 20; break;
    case 'snack': player.hp = Math.min(player.maxHp, player.hp + 30); break;
    case 'chips': run.chipsFound += 15; break;
  }
  recalc();
  buildSlots();
}
function evolve(id){
  const w = getWeapon(id); if (!w) return;
  w.evo = true; w.t = 0.2; w.boats.length = 0; w.saws.length = 0; w.beam = null;
  run.evolvedCount++;
  SAVE.stats.evolved = (SAVE.stats.evolved || 0) + 1; persist();
  Snd.play('evolve');
  ringFx(player.x, player.y, 10, 300, 0.6, '#ffc23a', 10);
  burst(player.x, player.y, 24, '#ffc23a', 260, 6, 0.8);
}

let curOpts = [];
function openLevelUp(){
  state = 'level'; releaseInput();
  run.pendingLv--;
  Snd.play('level');
  curOpts = buildOptions(run.level >= 1 && Math.random() < 0 ? 4 : 3);
  $('lvTitle').textContent = 'Level ' + run.level + '!';
  $('lvSub').textContent = run.pendingLv > 0 ? 'Choose one  (+' + run.pendingLv + ' more)' : 'Choose one';
  renderCards();
  show('scrLevel');
  const first = document.querySelector('#cards .card'); if (first) try { first.focus({ preventScroll: true }); } catch (e) {}
}
function renderCards(){
  const box = $('cards'); box.innerHTML = '';
  curOpts.forEach((o, i) => {
    const info = cardInfo(o);
    const b = document.createElement('button'); b.className = 'card ' + info.cls; b.style.animationDelay = (i * 0.07) + 's';
    b.appendChild(iconCanvas(info.icon, 64));
    const t = document.createElement('div'); t.className = 'ctext';
    t.innerHTML = '<span class="ctag"></span><span class="cname"></span><span class="cdesc"></span>' + (info.pair ? '<span class="cpair"></span>' : '') + '<span class="key">Press ' + (i + 1) + '</span>';
    t.querySelector('.ctag').textContent = info.tag; t.querySelector('.cname').textContent = info.name; t.querySelector('.cdesc').textContent = info.desc;
    if (info.pair) t.querySelector('.cpair').textContent = info.pair;
    b.appendChild(t);
    b.addEventListener('click', () => chooseCard(i));
    box.appendChild(b);
  });
  const rr = $('bReroll'); rr.textContent = 'Reroll (' + run.rerolls + ')'; rr.disabled = run.rerolls <= 0;
}
function chooseCard(i){
  if (state !== 'level' || !curOpts[i]) return;
  applyOption(curOpts[i]); Snd.play('pick');
  hide('scrLevel'); state = 'play';
  player.inv = Math.max(player.inv, 0.6);
  ringFx(player.x, player.y, 10, 120, 0.35, '#fff07a', 6);
  lastT = 0;
}
function reroll(){
  if (state !== 'level' || run.rerolls <= 0) return;
  run.rerolls--; curOpts = buildOptions(3); renderCards(); Snd.play('click');
  const first = document.querySelector('#cards .card'); if (first) try { first.focus({ preventScroll: true }); } catch (e) {}
}

/* ------------------------------ CHEST ------------------------------ */
let chestQueue = [];
function openChest(n, boss){
  run.chests++;
  const results = [];
  for (let i = 0; i < n; i++){
    const evoW = run.weapons.find(canEvolve);
    if (evoW){ evolve(evoW.id); results.push({ icon: evoW.id, name: WEAPONS[evoW.id].evoName, desc: 'Evolved! ' + WEAPONS[evoW.id].evoDesc }); continue; }
    const ups = [];
    for (const w of run.weapons) if (!w.evo && w.lv < 5) ups.push(['w', w.id]);
    for (const p of run.passOrder) if (plv(p) < 5) ups.push(['p', p]);
    if (ups.length){
      const [k, id] = pick(ups);
      if (k === 'w'){ const w = getWeapon(id); w.lv++; results.push({ icon: id, name: WEAPONS[id].name + ' Lv ' + w.lv, desc: WEAPONS[id].desc[w.lv - 1] }); }
      else { run.passives[id]++; if (id === 'belly') player.hp += 20; results.push({ icon: id, name: PASSIVES[id].name + ' Lv ' + plv(id), desc: PASSIVES[id].desc }); }
    } else { run.chipsFound += 20; results.push({ icon: 'chip', name: '20 Rubber Chips', desc: 'Everything is maxed out. Shiny!' }); }
  }
  if (boss){ player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.3); results.push({ icon: 'heal', name: 'Bubble Bath', desc: 'Healed 30% health.' }); }
  recalc(); buildSlots();
  Snd.play('evolve');
  if (bot){ return; }
  state = 'chest'; releaseInput();
  const list = $('chestList'); list.innerHTML = '';
  results.forEach((r, i) => {
    const row = document.createElement('div'); row.className = 'chestrow'; row.style.animationDelay = (0.15 + i * 0.18) + 's';
    row.appendChild(iconCanvas(r.icon, 48));
    const d = document.createElement('div'); d.innerHTML = '<b></b><span></span>'; d.querySelector('b').textContent = r.name; d.querySelector('span').textContent = r.desc;
    row.appendChild(d); list.appendChild(row);
  });
  show('scrChest');

}

let hintTimer = 0, bannerTimer = 0, lastPointer = 'mouse';
const CTRL_HINT = { float: 'Drag anywhere to swim', fixed: 'Use the stick at the bottom to swim', arrows: 'Hold the arrows to swim',

function placeHint(){

const SETTINGS = [
  ['sound', 'Sound effects', 'Squeaks, pops and splashes'],
  ['music', 'Music', 'Gentle bathtub tunes'],
  ['shake', 'Screen shake', 'Off when your device asks for reduced motion'],
  ['nums', 'Damage numbers', ''],
  ['follow', 'Mouse steering', 'Duck swims toward the mouse pointer']

const CTRL_MODES = [
  ['float', 'Floating stick', 'Drag anywhere'],
  ['fixed', 'Fixed stick', 'Stick at the bottom'],
  ['arrows', 'Arrow buttons', 'Arrow pad at the bottom'],
  ['tap', 'Tap to swim', 'Tap where to go'],

function ctrlIcon(id, sz){
  const c = mkCanvas(sz * 2, sz * 2); const g = c.getContext('2d'); g.scale(2, 2);
  const m = sz / 2; g.lineWidth = 2.2; g.strokeStyle = INK; g.fillStyle = INK; g.lineCap = 'round'; g.lineJoin = 'round';
  const arrow = (x, y, a, s) => { g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(s, 0); g.lineTo(-s * .6, -s * .8); g.lineTo(-s * .6, s * .8); g.closePath(); g.fill(); g.restore(); };
  if (id === 'float' || id === 'fixed'){
    g.beginPath(); g.arc(m, m, sz * 0.4, 0, TAU); g.stroke();
    g.fillStyle = id === 'fixed' ? '#8fe0f0' : '#ffd23f'; g.beginPath(); g.arc(m + (id === 'float' ? sz * .12 : 0), m - (id === 'float' ? sz * .1 : 0), sz * 0.17, 0, TAU); g.fill(); g.stroke();
    if (id === 'fixed'){ g.beginPath(); g.moveTo(sz * .1, sz * .96); g.lineTo(sz * .9, sz * .96); g.stroke(); }
  } else if (id === 'arrows'){
    const b = sz * 0.26;
    [[1, 0], [0, 1], [-1, 0], [0, -1]].forEach(d => { g.fillStyle = '#fff'; rrect(g, m + d[0] * b * 1.05 - b / 2, m + d[1] * b * 1.05 - b / 2, b, b, 3); g.fill(); g.stroke(); g.fillStyle = INK; arrow(m + d[0] * b * 1.05, m + d[1] * b * 1.05, Math.atan2(d[1], d[0]), b * .28); });
  } else if (id === 'tap'){
    g.beginPath(); g.ellipse(m + sz * .1, m + sz * .2, sz * .3, sz * .14, 0, 0, TAU); g.stroke();
    g.beginPath(); g.ellipse(m + sz * .1, m + sz * .2, sz * .1, sz * .05, 0, 0, TAU); g.fill();
    g.setLineDash([2, 3]); g.beginPath(); g.moveTo(sz * .12, sz * .12); g.lineTo(m + sz * .05, m + sz * .12); g.stroke(); g.setLineDash([]);
  } else if (id === 'swipe'){
    g.beginPath(); g.moveTo(sz * .14, sz * .7); g.quadraticCurveTo(m, sz * .7, sz * .78, sz * .3); g.stroke(); arrow(sz * .8, sz * .28, -0.75, sz * .14);
  } else if (id === 'tilt'){
    g.save(); g.translate(m, m); g.rotate(-0.35); g.fillStyle = '#fff'; rrect(g, -sz * .2, -sz * .36, sz * .4, sz * .72, 5); g.fill(); g.stroke(); g.restore();
    g.beginPath(); g.arc(m, m, sz * .46, -2.6, -1.9); g.stroke(); g.beginPath(); g.arc(m, m, sz * .46, 0.55, 1.2); g.stroke();

}
function chooseCtrl(id){

    } catch (e) {}

function renderControls(box){
  const wrap = document.createElement('div'); wrap.className = 'ctrlbox';
  const l = document.createElement('div'); l.className = 'lbl'; l.textContent = 'Touch controls'; wrap.appendChild(l);
  const grid = document.createElement('div'); grid.className = 'opts'; wrap.appendChild(grid);

    const b = document.createElement('button'); b.className = 'opt'; b.setAttribute('aria-pressed', ctrlMode() === id ? 'true' : 'false');
    b.appendChild(ctrlIcon(id, 34));
    const tx = document.createElement('div'); tx.textContent = name; const sm = document.createElement('small'); sm.textContent = sub; tx.appendChild(sm); b.appendChild(tx);
    b.addEventListener('click', () => { chooseCtrl(id); renderSettings(box, box.dataset.compact === '1'); });
    grid.appendChild(b);
  }
  const mode = ctrlMode();

        b.setAttribute('aria-label', label + ' ' + t);

    seg('Position', 'ctrlPos', [['left', 'Left'], ['center', 'Middle'], ['right', 'Right']]);

}
function renderSettings(box, compact){
  box.innerHTML = ''; box.dataset.compact = compact ? '1' : '0';
  renderControls(box);
  for (const [k, label, sub] of SETTINGS){
    if (compact && (k === 'follow' || k === 'nums')) continue;
    const r = document.createElement('div'); r.className = 'setrow';
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = label;

    const b = document.createElement('button'); b.className = 'tog'; b.setAttribute('aria-pressed', SAVE.settings[k] ? 'true' : 'false'); b.textContent = SAVE.settings[k] ? 'On' : 'Off';
    b.setAttribute('aria-label', label);
    b.addEventListener('click', () => { SAVE.settings[k] = !SAVE.settings[k]; persist(); Snd.apply(); b.setAttribute('aria-pressed', SAVE.settings[k] ? 'true' : 'false'); b.textContent = SAVE.settings[k] ? 'On' : 'Off'; Snd.play('click'); });
    r.appendChild(l); r.appendChild(b); box.appendChild(r);

}
let confirmCb = null, confirmReturn = null;
function askConfirm(text, cb){

  $('confirmText').textContent = text; show('confirm');
  try { $('confirmNo').focus({ preventScroll: true }); } catch (e) {}
